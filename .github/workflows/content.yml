name: Editorial content
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: npm run check
      - name: Capture the archive for review
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8765/articles.html -o /dev/null
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --window-size=1200,900 --screenshot="$RUNNER_TEMP/articles.png" http://127.0.0.1:8765/articles.html
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: archive-preview
          path: ${{ runner.temp }}/articles.png
      - if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
