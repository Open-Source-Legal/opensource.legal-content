name: CLA Assistant
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
jobs:
  agreement:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Use the trusted base workflow. Never check out or execute contributor code here.
      - name: Identify the revision being checked
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq 'select(.state == "open" and .base.ref == "main") | .head.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Record and check signatures
        if: steps.revision.outputs.sha != ''
        id: cla
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/Open-Source-Legal/opensource.legal-content/blob/main/CLA.md
          branch: cla-signatures
      - name: Report the CLA result on the contributor's commit
        if: always() && steps.revision.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.revision.outputs.sha }}
          STATE: ${{ steps.cla.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f context='Content CLA' -f state="$STATE" \
            -f description='Contributor agreement signature check' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
